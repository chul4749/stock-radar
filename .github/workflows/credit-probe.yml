name: credit-probe  # probe/ 안의 시험 스크립트를 골라 돌린다

on:
  workflow_dispatch:
    inputs:
      script:
        description: "probe/ 안의 시험 스크립트 이름 (확장자 빼고)"
        required: false
        default: credit

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python "probe/${SCRIPT}.py"
        env:
          SCRIPT: ${{ inputs.script || 'credit' }}
