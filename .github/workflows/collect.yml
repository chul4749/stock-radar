name: collect

on:
  schedule:
    - cron: "10 9 * * 1-5"   # 평일 18:10 KST (장 마감·수급 확정 뒤)
  workflow_dispatch:
    inputs:
      base_date:
        description: "기준일 YYYYMMDD (비우면 자동)"
        required: false
      dates:
        description: "먼저 다시 계산할 과거 기준일들 (공백으로 구분, 성적표 채우기용)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: |
          for d in ${{ inputs.dates }}; do python -m collector.main "$d"; done
          python -m collector.main ${{ inputs.base_date }}
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 결과 저장
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 대기열에서 기다린 실행은 예전 커밋으로 시작하므로, 최신 브랜치 위에 방금 만든 데이터를 통째로 얹는다
          mv site/data "$RUNNER_TEMP/data"
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -f -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          rm -rf site/data && mv "$RUNNER_TEMP/data" site/data
          git add -A site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push origin "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
