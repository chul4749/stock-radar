name: collect

on:
  schedule:
    # 정각 근처는 GitHub 예약이 몰려 몇 시간씩 늦어질 수 있어 비켜 잡는다
    - cron: "23 9 * * 1-5"    # 평일 18:23 KST (장 마감·수급 확정 뒤)
    - cron: "47 11 * * 1-5"   # 평일 20:47 KST 예비: 그날 데이터가 이미 있으면 건너뜀
  workflow_dispatch:
    inputs:
      base_date:
        description: "기준일 YYYYMMDD (비우면 자동)"
        required: false
      dates:
        description: "먼저 다시 계산할 과거 기준일들 (공백으로 구분, 성적표 채우기용)"
        required: false
      if_missing:
        description: "1이면 그날 데이터가 이미 있을 때 건너뜀 (외부 예약용)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # 대기열에서 기다린 실행도 예약 시점 커밋이 아니라 시작 시점의 최신 브랜치(코드·데이터)로 돈다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # 전 종목 차트·재무(charts/, fin/)는 main 대신 data-cache 브랜치에 둔다 (기록 없이 덮어써서 저장소가 커지지 않음)
      - name: 차트·재무 받기
        run: |
          if git fetch -q --depth=1 origin data-cache; then
            mkdir -p site/data && git archive FETCH_HEAD | tar -x -C site/data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: 수집·저장
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 저장할 때는 최신 main 위에 방금 만든 파일만 덮어쓴다 (그사이 다른 실행이 올린 날짜 파일을 지우지 않도록)
          save() {
            rm -rf "$RUNNER_TEMP/data" && cp -r site/data "$RUNNER_TEMP/data"
            git fetch -q origin "$GITHUB_REF_NAME"
            git checkout -q -f -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            cp -r "$RUNNER_TEMP/data/." site/data/
            python -m collector.reindex
            git add -A site/data
            git diff --cached --quiet || git commit -q -m "data: $1"
            git push -q origin "$GITHUB_REF_NAME"
          }
          # 과거 기준일은 하루씩 저장해서, 중간에 시간이 다 돼도 끝난 날짜는 남게 한다
          for d in ${{ inputs.dates }}; do
            python -m collector.main "$d" && save "$d 재계산" || echo "::warning::$d 재계산 실패"
          done
          python -m collector.main ${{ inputs.base_date }}
          save "$(date -u +%F)"
        env:
          # 예약 실행·외부 예약(if_missing=1)은 그날 데이터가 이미 있으면 건너뜀 (먼저 도착한 쪽만 수집)
          IF_MISSING: ${{ (github.event_name == 'schedule' || inputs.if_missing == '1') && '1' || '' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      # 차트·재무를 data-cache 브랜치에 저장: 커밋 하나짜리로 강제로 덮어씀 (예전 기록이 남지 않음)
      - name: 차트·재무 저장
        if: always()
        run: |
          [ -d site/data/fin ] || [ -d site/data/charts ] || [ -d site/data/hist ] || exit 0
          tmp="$RUNNER_TEMP/cache" && rm -rf "$tmp" && mkdir -p "$tmp"
          # hist/ = 200일선용 긴 종가 기록 (화면엔 안 씀, 배포에서 뺌)
          for d in charts fin hist; do if [ -d "site/data/$d" ]; then cp -r "site/data/$d" "$tmp/"; fi; done
          export GIT_INDEX_FILE="$RUNNER_TEMP/cache.idx"
          git --work-tree="$tmp" add -A -f .
          c=$(git -c user.name=stock-radar-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit-tree "$(git write-tree)" -m "차트·재무 캐시 $(date -u +%F)")
          # 가끔 GitHub가 push를 거절함(remote rejected) → 몇 번 다시, 끝내 안 되면 경고만 (배포는 계속)
          for i in 1 2 3; do
            git push -q -f --no-thin origin "$c:refs/heads/data-cache" && exit 0
            sleep $((i * 10))
          done
          echo "::warning::차트·재무 캐시 저장 실패 — 다음 수집 때 다시 받음"
      - run: rm -rf site/data/hist   # 긴 종가 기록은 수집용이라 화면 배포엔 안 넣음
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
