name: collect

on:
  schedule:
    # 정각 근처는 GitHub 예약이 몰려 몇 시간씩 늦어질 수 있어 비켜 잡는다
    - cron: "23 9 * * 1-5"    # 평일 18:23 KST (장 마감·수급 확정 뒤)
    - cron: "47 11 * * 1-5"   # 평일 20:47 KST 예비: 그날 데이터가 이미 있으면 건너뜀
  workflow_dispatch:
    inputs:
      base_date:
        description: "기준일 YYYYMMDD (비우면 자동)"
        required: false
      dates:
        description: "먼저 다시 계산할 과거 기준일들 (공백으로 구분, 성적표 채우기용)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: 수집·저장
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 대기열에서 기다린 실행은 예전 커밋으로 시작하므로, 최신 브랜치 위에 방금 만든 데이터를 통째로 얹는다
          save() {
            mv site/data "$RUNNER_TEMP/data"
            git fetch -q origin "$GITHUB_REF_NAME"
            git checkout -q -f -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            rm -rf site/data && mv "$RUNNER_TEMP/data" site/data
            git add -A site/data
            git diff --cached --quiet || git commit -q -m "data: $1"
            git push -q origin "$GITHUB_REF_NAME"
          }
          # 과거 기준일은 하루씩 저장해서, 중간에 시간이 다 돼도 끝난 날짜는 남게 한다
          for d in ${{ inputs.dates }}; do
            python -m collector.main "$d" && save "$d 재계산" || echo "::warning::$d 재계산 실패"
          done
          python -m collector.main ${{ inputs.base_date }}
          save "$(date -u +%F)"
        env:
          IF_MISSING: ${{ github.event.schedule == '47 11 * * 1-5' && '1' || '' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
