name: morning  # 새벽 미국장 결과로 '아침 요약'만 갱신 (종목 수집 없음)

on:
  schedule:
    - cron: "41 22 * * 0-4"   # 평일 07:41 KST (미국장 마감 후)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect   # 저녁 수집과 같은 줄에 세워 push가 엇갈리지 않게
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 아침 요약·저장
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m collector.morning
          cp site/data/morning.json "$RUNNER_TEMP/morning.json"
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -f -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/morning.json" site/data/morning.json
          git add site/data/morning.json
          git diff --cached --quiet || git commit -q -m "data: 아침 요약 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3 4; do   # GitHub가 가끔 push를 500으로 거절 → 최신 위로 다시 올려 재시도
            git push -q origin "$GITHUB_REF_NAME" && break
            [ $i = 4 ] && exit 1
            sleep $((i * 15)); git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q "origin/$GITHUB_REF_NAME" || true
          done
      # 전 종목 차트·재무(charts/, fin/)는 main 대신 data-cache 브랜치에 둔다 (기록 없이 덮어써서 저장소가 커지지 않음)
      - name: 차트·재무 받기
        run: |
          if git fetch -q --depth=1 origin data-cache; then
            mkdir -p site/data && git archive FETCH_HEAD | tar -x -C site/data
          fi
          rm -rf site/data/hist   # 200일선용 긴 종가 기록은 수집용 (화면 배포엔 안 넣음)
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: morning
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
