name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pykrx
      - run: python probe/probe.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7   # 저장 공간(무료 0.5GB) 아끼기
          name: probe-result
          path: |
            probe/result.json
            probe/dump/
