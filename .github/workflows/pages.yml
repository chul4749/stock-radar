name: pages

# 화면 코드(site/, 데이터 제외)만 바뀌었을 때 수집 없이 바로 배포한다
on:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 전 종목 차트·재무(charts/, fin/)는 git 대신 GitHub 캐시로 실행 사이를 잇는다 (저장소가 날마다 커지지 않게)
      - uses: actions/cache/restore@v4
        with:
          path: |
            site/data/charts
            site/data/fin
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
