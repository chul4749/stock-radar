name: pages

# 화면 코드(site/, 데이터 제외)만 바뀌었을 때 수집 없이 바로 배포한다
on:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 전 종목 차트·재무(charts/, fin/)는 main 대신 data-cache 브랜치에 둔다 (기록 없이 덮어써서 저장소가 커지지 않음)
      - name: 차트·재무 받기
        run: |
          if git fetch -q --depth=1 origin data-cache; then
            mkdir -p site/data && git archive FETCH_HEAD | tar -x -C site/data
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
